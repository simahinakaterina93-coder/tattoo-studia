<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALYWAWES — Вход для мастера</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(rgba(0, 8, 30, 0.78), rgba(0, 10, 35, 0.88)),
        url("ocean.jpg") center / cover no-repeat;
      color: #fff;
      font-family: "Cormorant Garamond", serif;
    }

    .auth-container {
      width: 540px;
      max-width: 92%;
      padding: 40px 50px;
      background: rgba(2, 8, 35, 0.88);
      border: 1px solid #2d75b8;
      border-radius: 14px;
      box-shadow: 0 0 40px rgba(0, 130, 210, 0.25);
    }

    .logo {
      display: block;
      text-align: center;
      color: #42afd4;
      font-size: 40px;
      text-decoration: none;
      margin-bottom: 15px;
      letter-spacing: 2px;
    }

    .line {
      width: 100%;
      height: 1px;
      background: #2874b8;
      margin-bottom: 25px;
    }

    h1 {
      text-align: center;
      font-size: 32px;
      font-weight: 400;
      margin-bottom: 30px;
    }

    .form-group { margin-bottom: 22px; }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 21px;
    }

    input, select {
      width: 100%;
      height: 54px;
      padding: 10px 15px;
      background: rgba(0, 5, 30, 0.5);
      border: 1px solid #2874b8;
      color: #fff;
      font-family: inherit;
      font-size: 20px;
      outline: none;
      border-radius: 6px;
    }

    input:focus, select:focus { border-color: #55c9e3; }

    select option { background: #02122e; }

    .submit-btn {
      display: block;
      width: 100%;
      height: 56px;
      margin-top: 10px;
      border: 1px solid #4d9ddd;
      border-radius: 12px;
      background: #315587;
      color: #fff;
      font-family: inherit;
      font-size: 24px;
      cursor: pointer;
      transition: 0.3s;
    }

    .submit-btn:hover { background: #3d679d; }

    .message {
      min-height: 26px;
      text-align: center;
      color: #55c9e3;
      font-size: 19px;
      margin-top: 15px;
    }

    .back {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #8eb7ca;
      text-decoration: none;
      font-size: 18px;
    }

    .back:hover { color: #fff; }

    .hint {
      font-size: 15px;
      color: #7ba7c4;
      text-align: center;
      margin-top: 12px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

<div class="auth-container">

  <a href="index.html" class="logo">ALYWAWES</a>
  <div class="line"></div>

  <h1>Вход для мастера</h1>

  <form id="masterLoginForm">

    <div class="form-group">
      <label>Выберите себя</label>
      <select id="masterSelect" required>
        <option value="">— выберите мастера —</option>
        <option value="lina">Лина Лифонова</option>
        <option value="daniil">Даниил Киров</option>
        <option value="liliya">Лилия Белова</option>
      </select>
    </div>

    <div class="form-group">
      <label>Пароль мастера</label>
      <input type="password" id="masterPassword" placeholder="Введите пароль" required>
    </div>

    <button type="submit" class="submit-btn">Войти</button>

    <div class="message" id="message"></div>
  </form>

  <div class="hint">
    Пароль по умолчанию для демонстрации: <b>12345</b>
  </div>

  <a href="index.html" class="back">Вернуться на сайт</a>

</div>

<script>
  const MASTER_PASSWORDS = {
    lina:   "12345",
    daniil: "12345",
    liliya: "12345"
  };

  const MASTER_NAMES = {
    lina:   "Лина Лифонова",
    daniil: "Даниил Киров",
    liliya: "Лилия Белова"
  };

  document.getElementById("masterLoginForm").addEventListener("submit", function (e) {
    e.preventDefault();

    const masterId = document.getElementById("masterSelect").value;
    const pass = document.getElementById("masterPassword").value;
    const msg  = document.getElementById("message");

    if (!masterId) {
      msg.textContent = "Выберите мастера.";
      return;
    }

    if (MASTER_PASSWORDS[masterId] !== pass) {
      msg.textContent = "Неверный пароль.";
      return;
    }

    localStorage.setItem("alywawesMasterLoggedIn", "true");
    localStorage.setItem("alywawesMasterId", masterId);
    localStorage.setItem("alywawesMasterName", MASTER_NAMES[masterId]);

    window.location.href = "master-panel.html";
  });
</script>

</body>
</html>
