<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALYWAWES — Чат с мастером</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      background: #02091d;
      color: #f5f7ff;
      font-family: "Cormorant Garamond", serif;
      overflow-x: hidden;
    }

    /* ================= HEADER ================= */
    .header {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 90px;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(3, 12, 36, 0.94);
      border-bottom: 1px solid rgba(86, 176, 220, 0.12);
      backdrop-filter: blur(12px);
    }

    .nav {
      width: min(1400px, 95%);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 30px;
    }

    .nav-left, .nav-right {
      display: flex;
      align-items: center;
      gap: clamp(20px, 2.5vw, 45px);
    }

    .nav-right { justify-content: flex-end; }

    .nav a {
      color: #f3f4f8;
      text-decoration: none;
      font-size: 22px;
      white-space: nowrap;
      transition: color .3s ease;
      cursor: pointer;
    }

    .nav a:hover { color: #51c5e9; }

    .logo { text-align: center; line-height: 1; text-decoration: none; }
    .logo-main {
      display: block;
      color: #42afd4;
      font-size: 34px;
      letter-spacing: 2px;
      font-weight: 500;
    }

    /* ================= ОСНОВНОЙ КАРКАС ================= */
    .chat-page {
      position: relative;
      min-height: 100vh;
      padding: 130px 5% 60px;

      background:
        linear-gradient(
          to bottom,
          rgba(1, 7, 26, .65),
          rgba(0, 20, 55, .55) 45%,
          rgba(1, 6, 24, .9)
        ),
        url("ocean.jpg") center center / cover no-repeat,
        radial-gradient(circle at 50% 20%, #087a9e 0%, #032d62 42%, #010822 85%);
      background-attachment: fixed;
    }

    .chat-container {
      width: min(1300px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 0;
      background: rgba(2, 10, 30, 0.72);
      border: 1px solid rgba(86, 176, 220, 0.25);
      border-radius: 16px;
      overflow: hidden;
      backdrop-filter: blur(14px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      min-height: 640px;
    }

    /* ================= СПИСОК МАСТЕРОВ (левая колонка) ================= */
    .masters-list {
      border-right: 1px solid rgba(86, 176, 220, 0.2);
      padding: 22px 18px;
      background: rgba(2, 8, 28, 0.55);
    }

    .masters-list h2 {
      font-size: 26px;
      font-weight: 500;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(86, 176, 220, 0.25);
      color: #fff;
    }

    .master-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      cursor: pointer;
      transition: background .25s ease, transform .25s ease;
      margin-bottom: 6px;
    }

    .master-item:hover {
      background: rgba(81, 197, 233, 0.12);
    }

    .master-item.active {
      background: rgba(81, 197, 233, 0.28);
      box-shadow: inset 0 0 0 1px rgba(81, 197, 233, 0.45);
    }

    .master-item .mini-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background-color: #0a2a4a;
      background-size: cover;
      background-position: center;
      flex-shrink: 0;
      border: 1px solid rgba(81, 197, 233, 0.35);
    }

    /* Фото мастеров */
    .mini-avatar.lina   { background-image: url("lina.jpg"); }
    .mini-avatar.daniil { background-image: url("danill.jpg"); }
    .mini-avatar.liliya { background-image: url("liliya.jpg"); }

    .master-item .mini-name {
      font-size: 18px;
      color: #dbeafe;
      font-family: "Cormorant Garamond", serif;
    }

    .master-item.active .mini-name { color: #fff; }

    /* ================= ОБЛАСТЬ ЧАТА (правая часть) ================= */
    .chat-area {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    /* Верхняя панель с выбранным мастером */
    .chat-header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 22px 28px;
      border-bottom: 1px solid rgba(86, 176, 220, 0.2);
    }

    .chat-header .big-avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background-color: #0a2a4a;
      background-size: cover;
      background-position: center;
      flex-shrink: 0;
      border: 1px solid rgba(81, 197, 233, 0.4);
    }

    .big-avatar.lina   { background-image: url("lina.jpg"); }
    .big-avatar.daniil { background-image: url("danill.jpg"); }
    .big-avatar.liliya { background-image: url("liliya.jpg"); }

    .chat-header .chat-name {
      font-size: 28px;
      color: #fff;
      font-weight: 500;
    }

    /* Сообщения */
    .messages {
      flex: 1;
      padding: 25px 28px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 340px;
      max-height: 460px;
      scrollbar-width: thin;
      scrollbar-color: rgba(81,197,233,0.4) transparent;
    }

    .messages::-webkit-scrollbar { width: 6px; }
    .messages::-webkit-scrollbar-thumb {
      background: rgba(81,197,233,0.4);
      border-radius: 3px;
    }

    .empty-chat-note {
      color: #8ba3b8;
      font-style: italic;
      font-size: 17px;
      font-family: "Inter", sans-serif;
      text-align: center;
      margin: auto;
    }

    .msg {
      max-width: 70%;
      padding: 10px 16px;
      border-radius: 14px;
      font-size: 18px;
      line-height: 1.4;
      word-wrap: break-word;
      animation: fadeIn .25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg.user {
      align-self: flex-end;
      background: #2a6aa4;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg.master {
      align-self: flex-start;
      background: rgba(81, 197, 233, 0.15);
      border: 1px solid rgba(81, 197, 233, 0.4);
      color: #e0f2fe;
      border-bottom-left-radius: 4px;
    }

    .msg .msg-time {
      display: block;
      font-size: 11px;
      color: rgba(220, 240, 255, 0.6);
      margin-top: 4px;
      font-family: "Inter", sans-serif;
    }

    /* Панель ввода */
    .input-bar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 22px;
      border-top: 1px solid rgba(86, 176, 220, 0.2);
      background: rgba(2, 8, 28, 0.5);
    }

    .input-bar input[type="text"] {
      flex: 1;
      height: 48px;
      padding: 0 20px;
      background: rgba(2, 15, 40, 0.6);
      border: 1px solid rgba(86, 176, 220, 0.3);
      border-radius: 24px;
      color: #fff;
      font-family: "Cormorant Garamond", serif;
      font-size: 18px;
      outline: none;
      transition: border-color .3s;
    }

    .input-bar input[type="text"]::placeholder {
      color: #8ba3b8;
      font-family: "Inter", sans-serif;
      font-size: 15px;
    }

    .input-bar input[type="text"]:focus {
      border-color: #51c5e9;
      box-shadow: 0 0 0 2px rgba(81, 197, 233, 0.15);
    }

    .attach-btn,
    .send-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid rgba(86, 176, 220, 0.35);
      background: rgba(2, 20, 45, 0.6);
      color: #c8e6f6;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: .25s;
      flex-shrink: 0;
    }

    .attach-btn:hover,
    .send-btn:hover {
      background: #51c5e9;
      color: #02091d;
      border-color: #51c5e9;
    }

    .send-btn {
      background: #2a6aa4;
      color: #fff;
      border-color: #2a6aa4;
    }

    .send-btn:hover { background: #51c5e9; color: #02091d; }

    /* ================= АДАПТИВ ================= */
    @media (max-width: 900px) {
      .header { height: 70px; }
      .nav-left, .nav-right { display: none; }
      .nav { display: flex; justify-content: center; }
      .logo-main { font-size: 28px; }
      .chat-page { padding-top: 100px; }

      .chat-container {
        grid-template-columns: 1fr;
        min-height: auto;
      }

      .masters-list {
        border-right: none;
        border-bottom: 1px solid rgba(86, 176, 220, 0.2);
        padding: 15px;
      }

      .masters-list h2 { font-size: 22px; margin-bottom: 12px; padding-bottom: 10px; }

      .master-item { padding: 8px 10px; }
      .master-item .mini-avatar { width: 40px; height: 40px; }
      .master-item .mini-name { font-size: 16px; }

      .chat-header { padding: 16px 18px; }
      .chat-header .big-avatar { width: 48px; height: 48px; }
      .chat-header .chat-name { font-size: 22px; }

      .messages { padding: 18px; max-height: 340px; }
      .msg { font-size: 16px; max-width: 85%; }
    }
  </style>
</head>

<body>

<!-- ================= ШАПКА ================= -->
<header class="header">
  <nav class="nav">
    <div class="nav-left">
      <a href="index.html">Главная</a>
      <a href="services.html">Услуги</a>
      <a href="masters.html">Мастера</a>
    </div>

    <a href="profile.html" class="logo">
      <span class="logo-main">ALYWAWES</span>
    </a>

    <div class="nav-right">
      <a href="services.html">Цены</a>
      <a href="profile.html">Профиль</a>
    </div>
  </nav>
</header>

<!-- ================= ЧАТ ================= -->
<div class="chat-page">
  <div class="chat-container">

    <!-- ЛЕВАЯ КОЛОНКА: СПИСОК МАСТЕРОВ -->
    <aside class="masters-list">
      <h2>Чат с мастером</h2>

      <div class="master-item active" data-master="lina" onclick="selectMaster('lina')">
        <div class="mini-avatar lina"></div>
        <span class="mini-name">Лина Лифонова</span>
      </div>

      <div class="master-item" data-master="daniil" onclick="selectMaster('daniil')">
        <div class="mini-avatar daniil"></div>
        <span class="mini-name">Даниил Киров</span>
      </div>

      <div class="master-item" data-master="liliya" onclick="selectMaster('liliya')">
        <div class="mini-avatar liliya"></div>
        <span class="mini-name">Лилия Белова</span>
      </div>
    </aside>

    <!-- ПРАВАЯ ЧАСТЬ: ПЕРЕПИСКА -->
    <section class="chat-area">

      <!-- Заголовок с выбранным мастером -->
      <div class="chat-header">
        <div class="big-avatar lina" id="chatAvatar"></div>
        <div class="chat-name" id="chatName">Лина Лифонова</div>
      </div>

      <!-- Сообщения -->
      <div class="messages" id="messages">
        <p class="empty-chat-note">Напишите сообщение, чтобы начать переписку.</p>
      </div>

      <!-- Поле ввода -->
      <div class="input-bar">
        <button class="attach-btn" title="Прикрепить файл" onclick="attachFile()">📎</button>
        <input type="text" id="messageInput" placeholder="Напишите сообщение.."
               onkeydown="if(event.key==='Enter') sendMessage()">
        <button class="send-btn" title="Отправить" onclick="sendMessage()">↑</button>
      </div>

    </section>

  </div>
</div>

<script>
  /* ========================
     ПРОВЕРКА АВТОРИЗАЦИИ
  ======================== */
  if (localStorage.getItem("alywawesLoggedIn") !== "true") {
    window.location.href = "auth.html";
  }

  /* ========================
     СПИСОК МАСТЕРОВ
  ======================== */
  const MASTERS = {
    lina:   { name: "Лина Лифонова",  cls: "lina"   },
    daniil: { name: "Даниил Киров",   cls: "daniil" },
    liliya: { name: "Лилия Белова",   cls: "liliya" }
  };

  let currentMaster = "lina";

  /* ========================
     ХРАНИЛИЩЕ СООБЩЕНИЙ
     Ключ: "alywawes_chat_<username>_<masterId>"
  ======================== */
  const user = JSON.parse(localStorage.getItem("alywawesUser")) || {};
  const userKey = user.username || "guest";

  function chatKey(masterId) {
    return `alywawes_chat_${userKey}_${masterId}`;
  }

  function loadMessages(masterId) {
    try {
      return JSON.parse(localStorage.getItem(chatKey(masterId))) || [];
    } catch (e) { return []; }
  }

  function saveMessages(masterId, list) {
    localStorage.setItem(chatKey(masterId), JSON.stringify(list));
  }

  /* ========================
     ПЕРЕКЛЮЧЕНИЕ МАСТЕРА
  ======================== */
  function selectMaster(masterId) {
    currentMaster = masterId;

    // Подсветка активного пункта
    document.querySelectorAll(".master-item").forEach(el => {
      el.classList.toggle("active", el.dataset.master === masterId);
    });

    // Обновляем заголовок чата
    const m = MASTERS[masterId];
    document.getElementById("chatName").textContent = m.name;

    const bigAvatar = document.getElementById("chatAvatar");
    bigAvatar.className = "big-avatar " + m.cls;

    // Рендерим сообщения
    renderMessages();
  }

  /* ========================
     ОТРИСОВКА СООБЩЕНИЙ
  ======================== */
  function renderMessages() {
    const container = document.getElementById("messages");
    const list = loadMessages(currentMaster);

    container.innerHTML = "";

    if (list.length === 0) {
      container.innerHTML = '<p class="empty-chat-note">Напишите сообщение, чтобы начать переписку.</p>';
      return;
    }

    list.forEach(msg => {
      const div = document.createElement("div");
      div.className = "msg " + (msg.from === "user" ? "user" : "master");
      div.innerHTML = `${escapeHtml(msg.text)}
        <span class="msg-time">${msg.time}</span>`;
      container.appendChild(div);
    });

    // Прокрутка вниз
    container.scrollTop = container.scrollHeight;
  }

  /* ========================
     ОТПРАВКА СООБЩЕНИЯ
  ======================== */
  function sendMessage() {
    const input = document.getElementById("messageInput");
    const text  = input.value.trim();
    if (!text) return;

    const list = loadMessages(currentMaster);

    const now = new Date();
    const time = now.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });

    // Сообщение пользователя
    list.push({ from: "user", text: text, time: time });
    saveMessages(currentMaster, list);

    input.value = "";
    renderMessages();

    // Имитация ответа мастера через 1.5–2.5 секунды
    setTimeout(() => {
      const answers = [
        "Здравствуйте! Да, конечно, обсудим ваш эскиз.",
        "Спасибо за сообщение, отвечу в течение дня.",
        "Отличная идея! Можем назначить дату консультации.",
        "Подскажите, пожалуйста, желаемый размер и место.",
        "Рад(а) помочь! Уточните, в каком стиле хотите тату."
      ];
      const reply = answers[Math.floor(Math.random() * answers.length)];

      const list2 = loadMessages(currentMaster);
      list2.push({ from: "master", text: reply, time: time });
      saveMessages(currentMaster, list2);

      renderMessages();
    }, 1500 + Math.random() * 1000);
  }

  /* ========================
     ПРИКРЕПЛЕНИЕ ФАЙЛА (имитация)
  ======================== */
  function attachFile() {
    alert("Функция прикрепления файлов появится позже.");
  }

  /* ========================
     ЭКРАНИРОВАНИЕ HTML
  ======================== */
  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, s => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;",
      '"': "&quot;", "'": "&#39;"
    }[s]));
  }
  /* ========================
     ПОДДЕРЖКА ?master=... ИЗ URL
  ======================== */
  const urlParams = new URLSearchParams(window.location.search);
  const masterFromUrl = urlParams.get("master");

  if (masterFromUrl && MASTERS[masterFromUrl]) {
    // Если пришли из эскиза — открываем соответствующего мастера
    selectMaster(masterFromUrl);
  } else {
    selectMaster("lina");
  }
  <script>
  /* ========================
     СТАРТ
  ======================== */
</script>

</body>
</html>
