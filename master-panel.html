<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ALYWAWES — Панель мастера</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background: #02091d;
      color: #f5f7ff;
      font-family: "Cormorant Garamond", serif;
      overflow-x: hidden;
    }

    /* ================= HEADER ================= */

    .header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 90px;
      z-index: 100;

      display: flex;
      align-items: center;
      justify-content: center;

      background: rgba(3, 12, 36, 0.94);

      border-bottom:
        1px solid rgba(86, 176, 220, 0.12);

      backdrop-filter: blur(12px);
    }

    .nav {
      width: min(1400px, 95%);

      display: grid;

      grid-template-columns:
        1fr auto 1fr;

      align-items: center;

      gap: 30px;
    }

    .nav-left,
    .nav-right {
      display: flex;
      align-items: center;

      gap: clamp(20px, 2.5vw, 45px);
    }

    .nav-right {
      justify-content: flex-end;
    }

    .nav a {
      color: #f3f4f8;
      text-decoration: none;

      font-size: 22px;

      white-space: nowrap;

      transition:
        color .3s ease;

      cursor: pointer;
    }

    .nav a:hover {
      color: #51c5e9;
    }

    .logo {
      text-align: center;
      line-height: 1;

      text-decoration: none;
    }

    .logo-main {
      display: block;

      color: #42afd4;

      font-size: 34px;

      letter-spacing: 2px;

      font-weight: 500;
    }

    .logout-link {
      color: #ff8b8b !important;
    }

    .logout-link:hover {
      color: #ff5050 !important;
    }

    /* ================= ОСНОВНАЯ СТРАНИЦА ================= */

    .panel-page {
      position: relative;

      min-height: 100vh;

      padding:
        120px 5% 40px;

      background:
        linear-gradient(
          to bottom,
          rgba(1, 7, 26, .65),
          rgba(0, 20, 55, .55) 45%,
          rgba(1, 6, 24, .9)
        ),
        url("ocean.jpg")
        center center / cover no-repeat,

        radial-gradient(
          circle at 50% 20%,
          #087a9e 0%,
          #032d62 42%,
          #010822 85%
        );

      background-attachment: fixed;
    }

    /* ================= ПРИВЕТСТВИЕ МАСТЕРА ================= */

    .master-welcome {
      width: min(1300px, 100%);

      margin: 0 auto 25px;

      padding: 22px 30px;

      background:
        rgba(2, 10, 30, 0.68);

      border:
        1px solid rgba(86, 176, 220, 0.25);

      border-radius: 16px;

      backdrop-filter: blur(14px);

      box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.25);
    }

    .welcome-text {
      display: flex;

      align-items: baseline;

      gap: 10px;

      font-size: 28px;
    }

    .welcome-text span {
      color: #dbeafe;

      font-weight: 400;
    }

    .welcome-text strong {
      color: #51c5e9;

      font-weight: 500;
    }

    .welcome-subtitle {
      margin-top: 5px;

      color: #8eb7ca;

      font-family: "Inter", sans-serif;

      font-size: 14px;
    }

    /* ================= КОНТЕЙНЕР ================= */

    .panel-container {
      width: min(1300px, 100%);

      margin: 0 auto;

      display: grid;

      grid-template-columns:
        320px 1fr;

      background:
        rgba(2, 10, 30, 0.78);

      border:
        1px solid rgba(86, 176, 220, 0.25);

      border-radius: 16px;

      overflow: hidden;

      backdrop-filter: blur(14px);

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.45);

      min-height: 640px;
    }

    /* ================= ЛЕВАЯ КОЛОНКА ================= */

    .left-col {
      border-right:
        1px solid rgba(86, 176, 220, 0.2);

      padding: 22px 18px;

      background:
        rgba(2, 8, 28, 0.6);

      display: flex;

      flex-direction: column;

      gap: 25px;
    }

    .section-title {
      font-size: 22px;

      font-weight: 500;

      margin-bottom: 14px;

      padding-bottom: 10px;

      border-bottom:
        1px solid rgba(86, 176, 220, 0.25);

      color: #fff;

      display: flex;

      justify-content: space-between;

      align-items: center;
    }

    .section-title small {
      color: #8eb7ca;

      font-size: 13px;

      font-family: "Inter", sans-serif;

      font-weight: 400;
    }

    /* ================= КЛИЕНТЫ ================= */

    .client-item {
      display: flex;

      align-items: center;

      gap: 12px;

      padding: 9px 10px;

      border-radius: 10px;

      cursor: pointer;

      transition:
        background .25s ease;

      margin-bottom: 5px;
    }

    .client-item:hover {
      background:
        rgba(81, 197, 233, 0.12);
    }

    .client-item.active {
      background:
        rgba(81, 197, 233, 0.28);

      box-shadow:
        inset 0 0 0 1px
        rgba(81, 197, 233, 0.45);
    }

    .client-avatar {
      width: 40px;
      height: 40px;

      border-radius: 50%;

      background: #0a2a4a;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 16px;

      color: #51c5e9;

      flex-shrink: 0;

      border:
        1px solid rgba(81, 197, 233, 0.35);
    }

    .client-meta {
      flex: 1;

      min-width: 0;
    }

    .client-meta .name {
      font-size: 17px;

      color: #dbeafe;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }

    .client-meta .service {
      font-size: 12px;

      color: #8eb7ca;

      font-family: "Inter", sans-serif;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }

    .empty-note {
      color: #8ba3b8;

      font-style: italic;

      font-size: 15px;

      font-family: "Inter", sans-serif;

      padding: 8px 0;
    }

    /* ================= СВОБОДНЫЕ ДАТЫ ================= */

    .slots-list {
      display: flex;

      flex-direction: column;

      gap: 6px;

      margin-top: 8px;
    }

    .slot-item {
      display: flex;

      justify-content: space-between;

      align-items: center;

      padding: 8px 12px;

      background:
        rgba(81, 197, 233, 0.10);

      border:
        1px solid rgba(81, 197, 233, 0.4);

      border-radius: 8px;

      font-size: 15px;

      color: #dbeafe;

      font-family: "Inter", sans-serif;
    }

    .slot-remove {
      border: none;

      background: transparent;

      color: #ff8b8b;

      cursor: pointer;

      font-size: 16px;

      padding: 0 4px;
    }

    .slot-remove:hover {
      color: #ff5050;
    }

    .slot-add-row {
      display: flex;

      gap: 6px;

      margin-top: 10px;
    }

    .slot-add-row input {
      flex: 1;

      height: 40px;

      padding: 0 10px;

      background:
        rgba(0, 5, 30, 0.6);

      border:
        1px solid rgba(86, 176, 220, 0.4);

      border-radius: 8px;

      color: #fff;

      font-family: "Inter", sans-serif;

      font-size: 13px;

      outline: none;
    }

    .slot-add-row input:focus {
      border-color: #51c5e9;
    }

    .slot-add-row button {
      height: 40px;

      padding: 0 14px;

      border:
        1px solid #2a6aa4;

      background: #2a6aa4;

      color: #fff;

      border-radius: 8px;

      cursor: pointer;

      font-family: "Inter", sans-serif;

      font-size: 14px;
    }

    .slot-add-row button:hover {
      background: #51c5e9;

      color: #02091d;
    }

    /* ================= ПРАВАЯ ЧАСТЬ ================= */

    .right-col {
      display: flex;

      flex-direction: column;

      height: 100%;

      min-height: 640px;
    }

    .chat-header {
      display: flex;

      align-items: center;

      gap: 16px;

      padding: 20px 26px;

      border-bottom:
        1px solid rgba(86, 176, 220, 0.2);
    }

    .big-avatar {
      width: 54px;
      height: 54px;

      border-radius: 50%;

      background: #0a2a4a;

      border:
        1px solid rgba(81, 197, 233, 0.4);

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 20px;

      color: #51c5e9;

      flex-shrink: 0;
    }

    .chat-header .chat-info h3 {
      font-size: 22px;

      color: #fff;

      font-weight: 500;
    }

    .chat-header .chat-info p {
      font-size: 14px;

      color: #8eb7ca;

      font-family: "Inter", sans-serif;
    }

    .messages {
      flex: 1;

      padding: 22px 26px;

      overflow-y: auto;

      display: flex;

      flex-direction: column;

      gap: 12px;

      min-height: 320px;

      max-height: 470px;
    }

    .messages::-webkit-scrollbar {
      width: 6px;
    }

    .messages::-webkit-scrollbar-thumb {
      background:
        rgba(81,197,233,0.4);

      border-radius: 3px;
    }

    .empty-chat-note {
      color: #8ba3b8;

      font-style: italic;

      font-size: 16px;

      font-family: "Inter", sans-serif;

      margin: auto;

      text-align: center;
    }

    .msg {
      max-width: 70%;

      padding: 10px 16px;

      border-radius: 14px;

      font-size: 17px;

      line-height: 1.4;

      word-wrap: break-word;

      animation:
        fadeIn .25s ease;
    }

    @keyframes fadeIn {

      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }

    /* МАСТЕР */

    .msg.master-msg {
      align-self: flex-end;

      background: #2a6aa4;

      color: #fff;

      border-bottom-right-radius: 4px;
    }

    /* КЛИЕНТ */

    .msg.user-msg {
      align-self: flex-start;

      background:
        rgba(81, 197, 233, 0.15);

      border:
        1px solid rgba(81, 197, 233, 0.4);

      color: #e0f2fe;

      border-bottom-left-radius: 4px;
    }

    .msg .msg-time {
      display: block;

      font-size: 11px;

      color:
        rgba(220, 240, 255, 0.6);

      margin-top: 4px;

      font-family: "Inter", sans-serif;
    }

    .input-bar {
      display: flex;

      align-items: center;

      gap: 12px;

      padding: 15px 22px;

      border-top:
        1px solid rgba(86, 176, 220, 0.2);

      background:
        rgba(2, 8, 28, 0.5);
    }

    .input-bar input[type="text"] {
      flex: 1;

      height: 46px;

      padding: 0 18px;

      background:
        rgba(2, 15, 40, 0.6);

      border:
        1px solid rgba(86, 176, 220, 0.3);

      border-radius: 23px;

      color: #fff;

      font-family:
        "Cormorant Garamond", serif;

      font-size: 17px;

      outline: none;
    }

    .input-bar input[type="text"]::placeholder {
      color: #8ba3b8;

      font-family: "Inter", sans-serif;

      font-size: 14px;
    }

    .input-bar input[type="text"]:focus {
      border-color: #51c5e9;
    }

    .send-btn {
      width: 46px;
      height: 46px;

      border-radius: 50%;

      border: none;

      background: #2a6aa4;

      color: #fff;

      font-size: 19px;

      cursor: pointer;

      transition: .25s;

      flex-shrink: 0;
    }

    .send-btn:hover {
      background: #51c5e9;

      color: #02091d;
    }

    .no-selection {
      display: flex;

      align-items: center;

      justify-content: center;

      flex: 1;

      color: #8ba3b8;

      font-size: 17px;

      font-family: "Inter", sans-serif;

      padding: 40px;

      text-align: center;
    }

    /* ================= АДАПТИВ ================= */

    @media (max-width: 900px) {

      .header {
        height: 70px;
      }

      .nav-left,
      .nav-right {
        display: none;
      }

      .nav {
        display: flex;

        justify-content: center;
      }

      .logo-main {
        font-size: 26px;
      }

      .panel-page {
        padding-top: 100px;
      }

      .master-welcome {
        margin-bottom: 18px;

        padding: 18px 20px;
      }

      .welcome-text {
        font-size: 24px;
      }

      .panel-container {
        grid-template-columns: 1fr;
      }

      .left-col {
        border-right: none;

        border-bottom:
          1px solid rgba(86, 176, 220, 0.2);
      }

    }

  </style>
</head>

<body>


<!-- ==========================================
     ШАПКА
========================================== -->

<header class="header">

  <nav class="nav">

    <div class="nav-left">

      <a href="index.html">
        Главная
      </a>

      <a href="services.html">
        Услуги
      </a>

      <a href="masters.html">
        Мастера
      </a>

    </div>


    <a href="master-panel.html" class="logo">

      <span class="logo-main">
        ALYWAWES
      </span>

    </a>


    <div class="nav-right">

      <a href="services.html">
        Цены
      </a>

      <a
        href="#"
        class="logout-link"
        onclick="logout(event)"
      >
        Выйти
      </a>

    </div>

  </nav>

</header>


<!-- ==========================================
     ПАНЕЛЬ
========================================== -->

<div class="panel-page">


  <!-- ==========================================
       ПРИВЕТСТВИЕ МАСТЕРА
  =========================================== -->

  <div class="master-welcome">

    <div class="welcome-text">

      <span>
        Здравствуйте,
      </span>

      <strong id="masterWelcomeName">
        Мастер
      </strong>

    </div>

    <div class="welcome-subtitle">

      Добро пожаловать в ваш личный кабинет

    </div>

  </div>


  <div class="panel-container">


    <!-- ======================================
         ЛЕВАЯ КОЛОНКА
    ======================================= -->

    <aside class="left-col">


      <!-- КЛИЕНТЫ -->

      <div>

        <div class="section-title">

          Мои клиенты

          <small id="clientsCount">
            0
          </small>

        </div>


        <div id="clientsContainer">

          <p class="empty-note">
            Загрузка клиентов...
          </p>

        </div>

      </div>


      <!-- СВОБОДНЫЕ ДАТЫ -->

      <div>

        <div class="section-title">

          Свободные даты

          <small id="slotsCount">
            0
          </small>

        </div>


        <div
          class="slots-list"
          id="slotsContainer"
        >

          <p class="empty-note">
            Нет свободных дат.
          </p>

        </div>


        <div class="slot-add-row">

          <input
            type="text"
            id="newSlotInput"
            placeholder="ДД.ММ.ГГГГ — ЧЧ:ММ"
          >

          <button onclick="addSlot()">
            +
          </button>

        </div>

      </div>

    </aside>


    <!-- ======================================
         ПРАВАЯ ЧАСТЬ
    ======================================= -->

    <section
      class="right-col"
      id="chatArea"
    >

      <div class="no-selection">

        Выберите клиента слева,
        чтобы открыть переписку.

      </div>

    </section>


  </div>

</div>


<script>

  /* ==========================================
     ПРОВЕРКА ВХОДА
  ========================================== */

  if (
    localStorage.getItem(
      "alywawesMasterLoggedIn"
    ) !== "true"
  ) {

    window.location.href =
      "master-login.html";

  }


  /* ==========================================
     ДАННЫЕ МАСТЕРА
  ========================================== */

  const MASTER_ID =
    Number(
      localStorage.getItem(
        "alywawesMasterId"
      )
    );

  const MASTER_NAME =
    localStorage.getItem(
      "alywawesMasterName"
    ) || "Мастер";


  /* ==========================================
     ИМЯ МАСТЕРА В ПРИВЕТСТВИИ
  ========================================== */

  const welcomeName =
    document.getElementById(
      "masterWelcomeName"
    );

  if (welcomeName) {

    welcomeName.textContent =
      MASTER_NAME;

  }


  let MASTER_USERNAME = "";

  let currentClient = null;

  let clientsCache = [];

  let appointmentsCache = [];


  /* ==========================================
     ОПРЕДЕЛЯЕМ ЛОГИН МАСТЕРА
  ========================================== */

  function getMasterUsername() {

    /*
      Используем ID мастера,
      а не имя.

      Это надёжнее, потому что
      имя в базе может отличаться.
    */

    const usernames = {

      1: "lina",

      2: "daniil",

      3: "liliya"

    };

    return usernames[MASTER_ID] || "";

  }


  MASTER_USERNAME =
    getMasterUsername();


  /* ==========================================
     HTML ЗАЩИТА
  ========================================== */

  function escapeHtml(str) {

    return String(str || "").replace(
      /[&<>"']/g,

      symbol => ({

        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"

      }[symbol])

    );

  }


  /* ==========================================
     ВРЕМЯ
  ========================================== */

  function formatTime(time) {

    if (!time) return "";

    try {

      const date =
        new Date(
          time.replace(" ", "T") + "Z"
        );

      return date.toLocaleTimeString(
        "ru-RU",
        {
          hour: "2-digit",
          minute: "2-digit"
        }
      );

    } catch {

      return "";

    }

  }


  /* ==========================================
     ЗАГРУЗКА ЗАПИСЕЙ МАСТЕРА
  ========================================== */

  async function loadAppointments() {

    if (!MASTER_ID) {

      console.error(
        "ID мастера не найден"
      );

      return;

    }


    try {

      const response =
        await fetch(
          `/api/master/${MASTER_ID}/appointments`
        );


      const data =
        await response.json();


      if (!data.success) {

        console.error(
          data.message
        );

        return;

      }


      appointmentsCache =
        data.appointments || [];


      renderClients();


    } catch (error) {

      console.error(
        "Ошибка загрузки записей:",
        error
      );

    }

  }


  /* ==========================================
     СОЗДАЁМ СПИСОК КЛИЕНТОВ
  ========================================== */

  function buildClients() {

    const clients = {};


    appointmentsCache.forEach(
      appointment => {

        const id =
          appointment.client_id;


        if (!clients[id]) {

          clients[id] = {

            id:
              appointment.client_id,

            name:
              appointment.client_name,

            username:
              appointment.client_username,

            service:
              appointment.service,

            date:
              appointment.date,

            time:
              appointment.time

          };

        } else {

          clients[id].service =
            appointment.service;

          clients[id].date =
            appointment.date;

          clients[id].time =
            appointment.time;

        }

      }
    );


    return Object.values(clients);

  }


  /* ==========================================
     ОТРИСОВКА КЛИЕНТОВ
  ========================================== */

  function renderClients() {

    clientsCache =
      buildClients();


    const container =
      document.getElementById(
        "clientsContainer"
      );


    document.getElementById(
      "clientsCount"
    ).textContent =
      clientsCache.length;


    if (
      clientsCache.length === 0
    ) {

      container.innerHTML = `
        <p class="empty-note">
          Пока нет клиентов,
          записанных к вам.
        </p>
      `;

      return;

    }


    container.innerHTML =
      clientsCache.map(client => `

        <div
          class="client-item ${
            currentClient &&
            currentClient.id === client.id
              ? "active"
              : ""
          }"
          onclick="openClient(${client.id})"
        >

          <div class="client-avatar">
            👤
          </div>


          <div class="client-meta">

            <div class="name">

              ${escapeHtml(
                client.name
              )}

            </div>


            <div class="service">

              ${escapeHtml(
                client.service
              )}

              •

              ${escapeHtml(
                client.date
              )}

              ${client.time
                ? " • " +
                  escapeHtml(
                    client.time
                  )
                : ""
              }

            </div>

          </div>

        </div>

      `).join("");

  }


  /* ==========================================
     ОТКРЫТЬ КЛИЕНТА
  ========================================== */

  function openClient(clientId) {

    const client =
      clientsCache.find(
        c => c.id === clientId
      );


    if (!client) return;


    currentClient = client;


    renderClients();

    renderChatHeader();

    loadChat();

  }


  /* ==========================================
     ШАПКА ЧАТА
  ========================================== */

  function renderChatHeader() {

    const area =
      document.getElementById(
        "chatArea"
      );


    area.innerHTML = `

      <div class="chat-header">

        <div class="big-avatar">
          👤
        </div>


        <div class="chat-info">

          <h3>
            ${escapeHtml(
              currentClient.name
            )}
          </h3>


          <p>

            ${escapeHtml(
              currentClient.service
            )}

            •

            ${escapeHtml(
              currentClient.date
            )}

            ${
              currentClient.time
                ? " • " +
                  escapeHtml(
                    currentClient.time
                  )
                : ""
            }

          </p>

        </div>

      </div>


      <div
        class="messages"
        id="messages"
      >

        <p class="empty-chat-note">
          Загрузка переписки...
        </p>

      </div>


      <div class="input-bar">

        <input
          type="text"
          id="messageInput"
          placeholder="Напишите клиенту..."
        >


        <button
          class="send-btn"
          onclick="sendMessage()"
        >
          ↑
        </button>

      </div>

    `;


    const input =
      document.getElementById(
        "messageInput"
      );


    if (input) {

      input.addEventListener(
        "keydown",
        event => {

          if (
            event.key === "Enter" &&
            !event.shiftKey
          ) {

            event.preventDefault();

            sendMessage();

          }

        }
      );

    }

  }


  /* ==========================================
     ЗАГРУЗКА ЧАТА
  ========================================== */

  async function loadChat() {

    if (
      !currentClient ||
      !MASTER_USERNAME
    ) {

      return;

    }


    try {

      const response =
        await fetch(
          `/api/chat/${MASTER_USERNAME}?client_id=${currentClient.id}`
        );


      const data =
        await response.json();


      if (!data.success) {

        console.error(
          data.message
        );

        return;

      }


      const container =
        document.getElementById(
          "messages"
        );


      if (!container) return;


      container.innerHTML = "";


      if (
        !data.messages ||
        data.messages.length === 0
      ) {

        container.innerHTML = `
          <p class="empty-chat-note">
            Пока нет сообщений.
            Напишите клиенту первым.
          </p>
        `;

        return;

      }


      data.messages.forEach(
        message => {

          const div =
            document.createElement(
              "div"
            );


          div.className =
            "msg " +
            (
              message.from === "master"
                ? "master-msg"
                : "user-msg"
            );


          div.innerHTML = `

            ${escapeHtml(
              message.text
            )}

            <span class="msg-time">

              ${formatTime(
                message.time
              )}

            </span>

          `;


          container.appendChild(div);

        }
      );


      container.scrollTop =
        container.scrollHeight;


    } catch (error) {

      console.error(
        "Ошибка загрузки чата:",
        error
      );

    }

  }


  /* ==========================================
     ОТПРАВИТЬ СООБЩЕНИЕ
  ========================================== */

  async function sendMessage() {

    if (!currentClient) {

      alert(
        "Сначала выберите клиента."
      );

      return;

    }


    if (!MASTER_USERNAME) {

      alert(
        "Не удалось определить мастера."
      );

      return;

    }


    const input =
      document.getElementById(
        "messageInput"
      );


    if (!input) return;


    const text =
      input.value.trim();


    if (!text) return;


    try {

      const response =
        await fetch(
          `/api/master/chat/${MASTER_USERNAME}`,
          {

            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

              client_id:
                currentClient.id,

              message:
                text

            })

          }
        );


      const data =
        await response.json();


      if (!data.success) {

        alert(
          data.message ||
          "Не удалось отправить сообщение."
        );

        return;

      }


      input.value = "";


      await loadChat();


      input.focus();


    } catch (error) {

      console.error(
        "Ошибка отправки:",
        error
      );


      alert(
        "Не удалось отправить сообщение."
      );

    }

  }


  /* ==========================================
     СВОБОДНЫЕ ДАТЫ
     Пока храним отдельно для каждого мастера
  ========================================== */

  let masterSlots = [];


async function loadSlots() {

    if (!MASTER_ID) {
        console.error("Не найден ID мастера");
        return;
    }

    try {

        const response = await fetch(
            `/api/master/${MASTER_ID}/slots`
        );

        const data = await response.json();

        if (!data.success) {

            console.error(
                data.message || "Не удалось загрузить даты"
            );

            return;
        }

        masterSlots = data.slots || [];

        renderSlots();

    } catch (error) {

        console.error(
            "Ошибка загрузки свободных дат:",
            error
        );

    }
}


function renderSlots() {

    const container =
        document.getElementById("slotsContainer");

    const counter =
        document.getElementById("slotsCount");


    if (counter) {
        counter.textContent = masterSlots.length;
    }


    if (masterSlots.length === 0) {

        container.innerHTML = `
            <p class="empty-note">
                Нет свободных дат.
            </p>
        `;

        return;
    }


    container.innerHTML = masterSlots.map(slot => {

        return `
            <div class="slot-item">

                <span>
                    ${escapeHtml(slot.slot_date)}
                    —
                    ${escapeHtml(slot.slot_time)}
                </span>

                <button
                    class="slot-remove"
                    onclick="removeSlot(${slot.id})"
                    title="Удалить"
                >
                    ✕
                </button>

            </div>
        `;

    }).join("");
}


async function addSlot() {

    const input =
        document.getElementById("newSlotInput");

    if (!input) return;

    let value =
        input.value.trim();

    if (!value) {
        alert("Введите дату и время.");
        return;
    }

    /*
     * Разрешаем:
     * 23.10.2026 - 13.20
     * 23.10.2026 — 13:20
     * 23.10.2026 - 13:20
     */

    value = value
        .replace(/\s*[-–—]\s*/, " — ");

    const parts =
        value.split("—");

    if (parts.length !== 2) {

        alert(
            "Введите дату в формате:\n23.10.2026 - 13:20"
        );

        return;
    }

    const slotDate =
        parts[0].trim();

    let slotTime =
        parts[1].trim();

    /*
     * 13.20 → 13:20
     */

    slotTime =
        slotTime.replace(".", ":");


    /*
     * Проверяем дату
     */

    if (
        !/^\d{2}\.\d{2}\.\d{4}$/.test(
            slotDate
        )
    ) {

        alert(
            "Дата должна быть в формате:\n23.10.2026"
        );

        return;
    }


    /*
     * Проверяем время
     */

    if (
        !/^\d{2}:\d{2}$/.test(
            slotTime
        )
    ) {

        alert(
            "Время должно быть в формате:\n13:20"
        );

        return;
    }


    try {

        const response =
            await fetch(
                `/api/master/${MASTER_ID}/slots`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        slot_date:
                            slotDate,

                        slot_time:
                            slotTime

                    })

                }
            );


        const data =
            await response.json();


        if (!data.success) {

            alert(
                data.message ||
                "Не удалось добавить дату."
            );

            return;
        }


        /*
         * Очищаем поле
         */

        input.value = "";


        /*
         * Заново загружаем даты
         */

        await loadSlots();


    } catch (error) {

        console.error(
            "Ошибка добавления даты:",
            error
        );

        alert(
            "Не удалось подключиться к серверу."
        );

    }

}
/* ==========================================
   УДАЛЕНИЕ СВОБОДНОЙ ДАТЫ
========================================== */

async function removeSlot(slotId) {

    if (!slotId) {
        console.error("Не передан ID слота:", slotId);
        return;
    }

    if (!confirm("Удалить эту свободную дату?")) {
        return;
    }

    try {

        const response = await fetch(
            `/api/master/slots/${slotId}`,
            {
                method: "DELETE"
            }
        );

        const data = await response.json();

        console.log("Ответ удаления:", data);

        if (!response.ok || !data.success) {

            alert(
                data.message ||
                "Не удалось удалить дату."
            );

            return;
        }

        // Сразу убираем слот из текущего списка
        masterSlots =
            masterSlots.filter(
                slot => Number(slot.id) !== Number(slotId)
            );

        // Перерисовываем список
        renderSlots();

    } catch (error) {

        console.error(
            "Ошибка удаления даты:",
            error
        );

        alert(
            "Не удалось подключиться к серверу."
        );

    }
}
  /* ==========================================
     ВЫХОД
  ========================================== */

  function logout(event) {

    event.preventDefault();


    if (
      !confirm(
        "Выйти из панели мастера?"
      )
    ) {

      return;

    }


    localStorage.removeItem(
      "alywawesMasterLoggedIn"
    );

    localStorage.removeItem(
      "alywawesMasterId"
    );

    localStorage.removeItem(
      "alywawesMasterName"
    );


    window.location.href =
      "index.html";

  }


  /* ==========================================
     ЗАПУСК
  ========================================== */

  loadAppointments();

  loadSlots();


  /* ==========================================
     ОБНОВЛЕНИЕ
  ========================================== */

  setInterval(
    async () => {

      await loadAppointments();


      if (currentClient) {

        await loadChat();

      }

    },
    3000
  );

</script>
